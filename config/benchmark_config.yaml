# Contrato congelado do benchmark.
# Todo valor abaixo já está decidido nos docs; tests/test_config.py guarda
# os valores críticos (seed, amostras, alpha, max_tokens) contra alteração acidental.
# Referências ao README usam títulos de seção (âncoras estáveis), não números de linha.

dataset:
  name: nilc-nlp/assin2          # README › "The 3 Evaluated Scenarios"
  split: test
  frozen_samples: 200            # conjunto congelado (README › "The 3 Evaluated Scenarios")
  seed: 42                       # determinismo da amostragem

model:
  id: Qwen/Qwen3-4B-Instruct-2507-AWQ  # README › "Running the vLLM Server & Benchmark"
  quantization: awq

serving:
  base_url: "http://127.0.0.1:8000/v1"
  port: 8000
  prefix_caching: true           # --enable-prefix-caching (README › "Running the vLLM Server & Benchmark")

system1:
  endpoint: /v1/systemone        # fast-path: 1 token + logprobs (README › "The 3 Evaluated Scenarios")
  max_tokens: 1

system2:
  endpoint: /v1/chat/completions # slow-path: CoT + JSON (README › "The 3 Evaluated Scenarios")
  max_tokens: 256

router:
  alpha: 0.85                    # limiar de confiança (README › "The 3 Evaluated Scenarios")

metrics:
  percentiles: [50, 95, 99]

kpis:                            # critérios de sucesso (README › "Target Success Criteria (KPIs)")
  p95_reduction: 0.50            # p95 da cascata >= 50% menor que System 2 Pure
  token_savings: 0.60            # tokens decodificados >= 60% menores
  apgr_target: 0.95              # recuperar >= 95% da diferença de acurácia
