# Contrato congelado do benchmark (pós-pivot NCM, 2026-11-14).
# Todo valor abaixo já está decidido em docs/dataset-pivot-ncm-spec.md;
# tests/test_config.py guarda os valores críticos (seed, amostras, alpha,
# max_tokens, composição head/tail) contra alteração acidental.
# Referências ao README usam títulos de seção (âncoras estáveis), não números
# de linha. A implementação ASSIN 2 está no histórico do git (commit 79a8654).

dataset:
  name: yurifacanha/NCM-RAFT-samall   # README › "The 3 Evaluated Scenarios"
  split: train                        # dataset tem um único split (train)
  frozen_samples: 800                 # conjunto congelado (spec › Story 3)
  seed: 42                            # determinismo da amostragem
  head_share: 0.65                    # ~65% cabeça / ~35% cauda (spec › Story 3)
  head_min_code_freq: 50              # código head = >=50 ocorrências no pool limpo
  label_digits: 8                     # granularidade do rótulo (sonda decide; 8 = item)

model:
  id: Qwen/Qwen3-4B-AWQ           # README › "Running the vLLM Server & Benchmark"
  quantization: awq

serving:
  base_url: "http://127.0.0.1:8000/v1"
  port: 8000
  prefix_caching: true           # --enable-prefix-caching (README › "Running the vLLM Server & Benchmark")

system1:
  endpoint: /v1/chat/completions # fast-path: geração curta do código NCM (spec › Decisão 1(d))
  max_tokens: 12                 # 8 dígitos + margem; sem raciocínio
  top_logprobs: 20               # base da confiança (média geométrica) e da entropia

system2:
  endpoint: /v1/chat/completions # slow-path: CoT + JSON (README › "The 3 Evaluated Scenarios")
  max_tokens: 256

router:
  alpha: 0.85                    # limiar de confiança (README › "The 3 Evaluated Scenarios")

metrics:
  percentiles: [50, 95, 99]

kpis:                            # gates redefinidos (spec › Story 6, SC-A/B/C)
  p95_reduction: 0.50            # SC-C: p95 da cascata >= 50% menor que System 2 Pure
  token_savings: 0.60            # SC-C: tokens decodificados >= 60% menores
  tail_gap_pp: 10                # SC-A: (acc S2 - acc S1) na cauda >= 10 pontos percentuais
  recovery_share: 0.50           # SC-B: cascata recupera >= 50% do gap da cauda
