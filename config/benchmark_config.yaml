# Contrato congelado do benchmark DARU (pivot 2026-11-15, SPEC-DARU.md).
# tests/test_config.py guarda os valores críticos (categorias, seed, tamanhos,
# alpha, endpoints) contra alteração acidental. As 12 categorias são as
# top-n por contagem real no xlsx via select_food_categories (loader DARU),
# fora limpeza/higiene e afins (escopo = comida e bebida).

dataset:
  name: gilsileydaru/classificao-produtos-varejo-cpg-prbr
  file: DATASETPRODUTOSVAREJOBRASIL.xlsx
  categories:                   # (nome, linhas no arquivo real)
    - MERCEARIA                 # 23283
    - FRIOS E LATICINIOS        # 12133
    - ACOUGUE E PEIXARIA        # 6308
    - PREPARADOS E CONGELADOS   # 6293
    - HORTIFRUTI (FLV)          # 6292
    - PADARIA E CONFEITARIA     # 5416
    - BEBIDAS ALCOOLICAS        # 4513
    - SUCOS E REFRESCOS         # 4186
    - REFRIGERANTES             # 2514
    - LACTEOS                   # 2189
    - VINHOS E FERMENTADOS      # 1591
    - AGUA MINERAL              # 1430
  validation: 200               # 140 cabeça + 60 cauda (SPEC-DARU.md §3)
  test: 600                     # 420 cabeça + 180 cauda; congelado, medido 1x
  head_share: 0.7
  tail_max_chars: 20            # cauda = descrição com <= 20 caracteres
  seed: 42                      # determinismo da amostragem

model:
  id: Qwen/Qwen3-4B-AWQ         # Qwen2.5-7B-AWQ não funciona no /v1/systemone (histórico do repo)
  quantization: awq

serving:
  base_url: "http://127.0.0.1:8000/v1"
  port: 8000
  prefix_caching: true          # --enable-prefix-caching

system1:
  endpoint: /v1/systemone       # pergunta choice; servidor devolve prob. por opção
  alias_letters: [A, B, C, D, E, F, G, H, I, J, K, L]   # 1 letra por categoria

system2:
  endpoint: /v1/chat/completions
  max_tokens: 256
  enable_thinking: false        # Qwen3: CoT no prompt, sem o modo thinking nativo

router:
  alpha: 0.85                   # limiar de P_top; final escolhido na validação (sweep 0.70-0.90)

metrics:
  percentiles: [50, 95, 99]

kpis:                           # gates (SPEC-DARU.md §1)
  tail_gap_pp: 10               # SC-A: S2 >= S1 + 10pp na cauda
  recovery_share: 0.5           # SC-C: APGR >= 0.5
  token_share_vs_s2: 0.4        # SC-C: cascata gasta <= 40% dos tokens do System 2
