[project]
name = "adaptive-cascade-routing"
version = "0.1.0"
description = "Benchmark empírico: System 1 (logprobs) vs System 2 (CoT) com Adaptive Cascade Routing para NLI em PT-BR (ASSIN 2)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# vLLM exige CUDA; roda apenas no Colab (GPU T4) ou máquina com CUDA 12.x.
# Instale com: uv sync --extra serving
serving = [
    "vllm>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.uv]
# Aplicação (não biblioteca publicável): imports seguem o modelo
# `python -m src.metrics.evaluator`, não um pacote instalável.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
